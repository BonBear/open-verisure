; Läsare för U3 (EON EN25F40, 512 KB SPI NOR) via SOIC-8-klämma.
; Kortet som läses ska vara helt strömlöst; U3 matas från ESP32:ns 3V3.

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=0

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 921600

; Samma som esp32c3 men för kort utan USB-UART-krets (USB direkt på GPIO 18/19)
[env:esp32c3_usb]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 921600
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
