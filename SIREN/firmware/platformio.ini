[platformio]
default_envs = siren_f149

[env:siren_f149]
platform = timsp430@2.4.0
board = verisure_siren_f149
build_flags =
    -Wall -Wextra -Os
    -DSIREN_ENABLE_HV_BOOST

; Bench build with P1.7 HV horn boost disabled (keep Hi-Z when probing with a logic analyzer)
[env:siren_f149_bench]
extends = env:siren_f149
build_flags = -Wall -Wextra -Os

[env:siren_f149_ci]
extends = env:siren_f149
build_flags =
    ${env:siren_f149.build_flags}
    -DSIREN_USE_EXAMPLE_CONFIG

