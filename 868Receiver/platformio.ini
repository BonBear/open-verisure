[env:lolin_s2_mini]
platform = espressif32@7.0.1   ; pinned: the version the gateway is tested with (8.x adds -Wformat warnings)
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=0
    -D MQTT_MAX_PACKET_SIZE=1024

lib_deps =
    lsatan/SmartRC-CC1101-Driver-Lib
    knolleary/PubSubClient
