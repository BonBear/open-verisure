[platformio]
default_envs = lolin_s2_mini   ; a plain "pio run -t upload" must never flash the evaluation build

[env:lolin_s2_mini]
platform = espressif32@8.0.0   ; Arduino core 3.x, ESP-IDF 5.x
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=0
    -D MQTT_MAX_PACKET_SIZE=1024

lib_deps =
    lsatan/SmartRC-CC1101-Driver-Lib@3.0.2   ; pinned: 3.x calls pinMode() on the SPI pins (see radio_task.cpp)
    knolleary/PubSubClient@2.8

; gw-radio-task bench evaluation: the default env plus the CLI commands loopblock, radiostall and
; polldelay (radio_task.h, serial_cli.cpp). Not built by default (default_envs): flash it only on
; purpose with "pio run -d 868Receiver -e lolin_s2_mini_eval -t upload".
[env:lolin_s2_mini_eval]
extends = env:lolin_s2_mini
build_flags =
    ${env:lolin_s2_mini.build_flags}
    -D RADIO_EVAL=1
