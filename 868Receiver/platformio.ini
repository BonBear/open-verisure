[platformio]
default_envs = lolin_s2_mini   ; a plain "pio run -t upload" must never flash the evaluation build

[env:lolin_s2_mini]
platform = espressif32@8.0.0   ; Arduino core 3.x, ESP-IDF 5.x
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200

; The web server is lib/GuardedWebServer (bounded run time per request, see its header), not the
; core's WebServer, which can block loop() for 10+ s before any password check and would trip the
; 5 s loop watchdog. The two WEBSERVER_* limits only matter if the core library is ever used again
; (its defaults are 5 s and 10 s); they are set below the watchdog as a second line of defence.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=0
    -D MQTT_MAX_PACKET_SIZE=1024
    -D WEBSERVER_MAX_LINE_WAIT=3000
    -D WEBSERVER_MAX_HEADER_WAIT=3000

lib_deps =
    knolleary/PubSubClient@2.8

; the core's WebServer must not be built or linked: nothing may include <WebServer.h> (a compile error then)
lib_ignore =
    WebServer

; gw-radio-task bench evaluation: the default env plus the CLI commands loopblock, wdttest,
; radiostall, polldelay and sniff (radio_task.h, serial_cli.cpp, sniff_format.h). Not built by default (default_envs): flash
; it only on purpose with "pio run -d 868Receiver -e lolin_s2_mini_eval -t upload".
[env:lolin_s2_mini_eval]
extends = env:lolin_s2_mini
build_flags =
    ${env:lolin_s2_mini.build_flags}
    -D RADIO_EVAL=1
