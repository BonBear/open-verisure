# CodeQL code scanning: GitHub's static analysis for security bugs, on every pull request, on
# pushes to main and weekly. Results appear under Security > Code scanning.
# - python: the build, flash, key and test scripts (no build needed)
# - actions: the workflows themselves
# - c-cpp: the gateway's security-critical sources, compiled with the host g++ through the unit
#   test build (crypto, replay filter, portal helpers, downlink, image receiver, JPEG splice).
#   The ESP32 cross build and the CC1110 (SDCC) firmware cannot be traced by CodeQL.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build the gateway sources on the host (c-cpp)
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev g++ make
          # compile only, no sanitizers (CodeQL traces the compiler calls)
          make -C 868Receiver/test_host SANITIZE= build/gateway_tests build/fuzz_tests
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
