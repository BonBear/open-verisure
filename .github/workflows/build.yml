# Actions are pinned to commit SHAs (tag in the comment) and the SDCC download is checksummed.
# Build check for every push and pull request: the gateway firmware and its host unit tests, both
# CC1110 firmwares and the host tests of their counter log, the smoke detector (EFR32FG14) firmware,
# the key derivation and the Python script tests. It uses only the *.example configs (placeholder
# keys, no credentials), so nothing secret is needed or produced. The builds are never flashed: the
# CC1110 builds are unseeded (counter block 1).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway (ESP32-S2, PlatformIO)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('868Receiver/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install "platformio>=6.1"
      - name: secrets.h from the example
        run: cp 868Receiver/src/secrets.h.example 868Receiver/src/secrets.h
      - name: Build
        run: pio run -d 868Receiver

  gateway-unit-tests:
    name: Gateway unit tests (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install g++, make and mbedTLS
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev g++ make
      - name: Fewer mmap random bits for AddressSanitizer
        # ASan of GCC 13 can crash at start-up with the kernel's 32 bits (Ubuntu 24.04 runners)
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Run the tests
        # crypto.cpp, config_manager.cpp, downlink.cpp, portal_util.h, image_receiver.cpp and
        # jpeg_splice.cpp built with g++ against stubs (868Receiver/test_host): unit tests and
        # deterministic fuzz tests (fuzz_*.cpp, a few seconds); only public test keys, no secrets.h
        run: make -C 868Receiver/test_host

  cc1110-ctr-log-tests:
    name: CC1110 counter log tests (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Fewer mmap random bits for AddressSanitizer
        # ASan of GCC 13 can crash at start-up with the kernel's 32 bits (Ubuntu 24.04 runners)
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Run the tests
        # the real ctr_log.c and both ctr_boot() (cut out of the main.c files at build time) on
        # an emulated CC1110 flash, with gcc/g++ and the sanitizers (cc1110_common/test_host)
        run: make -C cc1110_common/test_host

  cc1110:
    name: Door sensor and camera (CC1110, SDCC)
    runs-on: ubuntu-24.04
    env:
      SDCC_VERSION: "4.5.0"
      # SHA-1 of sdcc-4.5.0-amd64-unknown-linux2.5.tar.bz2 as listed by SourceForge
      SDCC_SHA1: "194021a5b4569948b878a2bd06dc1193ebf9106d"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the Python packages the scripts import
        run: pip install "pyserial>=3.5" "requests>=2.28" "cryptography>=41" "paho-mqtt>=2.0,<3"
      - name: Install SDCC ${{ env.SDCC_VERSION }}
        # Ubuntu 24.04 packages SDCC 4.2; the README asks for 4.5 or newer
        run: |
          curl -fsSL -o sdcc.tar.bz2 \
            "https://sourceforge.net/projects/sdcc/files/sdcc-linux-amd64/${SDCC_VERSION}/sdcc-${SDCC_VERSION}-amd64-unknown-linux2.5.tar.bz2/download"
          echo "${SDCC_SHA1}  sdcc.tar.bz2" | sha1sum -c -
          mkdir -p "$RUNNER_TEMP/sdcc"
          tar -xjf sdcc.tar.bz2 -C "$RUNNER_TEMP/sdcc" --strip-components=1
          echo "$RUNNER_TEMP/sdcc/bin" >> "$GITHUB_PATH"
      - run: sdcc --version
      - name: config.h files from the examples
        run: |
          cp VerisureDoorSensor/config.h.example VerisureDoorSensor/config.h
          cp MD_CAM/firmware/config.h.example MD_CAM/firmware/config.h
      - name: Door sensor
        run: python VerisureDoorSensor/build_and_flash.py --compile-only
      - name: Camera
        run: python MD_CAM/build_and_flash_md_cam.py --compile-only
      - name: SDCC warnings as annotations
        # The build scripts keep SDCC's output quiet; AGENTS.md asks for warning-free builds, so
        # every warning is shown on the run and the PR, and any warning fails the job.
        run: |
          set -o pipefail
          n=0
          for spec in "VerisureDoorSensor:--model-small" "MD_CAM/firmware:--model-large"; do
            dir=${spec%%:*}; model=${spec##*:}
            out=$( cd "$dir" && sdcc -mmcs51 "$model" --code-size 0x7800 --xram-loc 0xF000 \
                   --xram-size 0x0E00 -DCTR_SEED=1UL -c main.c -o "$RUNNER_TEMP/" 2>&1 ) || true
            while IFS= read -r l; do
              if [[ "$l" =~ ^([^:]+):([0-9]+):\ warning\ (.*)$ ]]; then
                echo "::warning file=$dir/${BASH_REMATCH[1]},line=${BASH_REMATCH[2]}::SDCC warning ${BASH_REMATCH[3]}"
                n=$((n+1))
              fi
            done <<< "$out"
          done
          echo "SDCC warnings: $n" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -ne 0 ]; then
            echo "::error::$n SDCC warning(s); the CC1110 firmware must build without warnings"
            exit 1
          fi

  siren:
    name: Siren (MSP430F149, PlatformIO & host tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: pio-siren-${{ hashFiles('SIREN/firmware/platformio.ini', 'tools/esp32_msp430_bsl/platformio.ini') }}
      - name: Fewer mmap random bits for AddressSanitizer
        # ASan of GCC 13 can crash at start-up with the kernel's 32 bits (Ubuntu 24.04 runners)
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Host tests (AES-128 & flash counter log)
        run: gcc -Wall -Wextra -Werror -fsanitize=address,undefined -DHOST_TEST -I SIREN/firmware/src tests/test_siren_firmware.c SIREN/firmware/src/aes128.c SIREN/firmware/src/flash_ctr.c -o /tmp/test_siren && /tmp/test_siren
      - name: Install PlatformIO
        run: pip install "platformio>=6.1"
      - name: Build firmware (example config)
        run: pio run -d SIREN/firmware -e siren_f149_ci
      - name: Build BSL flasher (ESP32-C3)
        run: pio run -d tools/esp32_msp430_bsl

  smoke:
    name: Smoke detector (EFR32FG14, arm-none-eabi-gcc)
    runs-on: ubuntu-24.04
    env:
      GECKO_SDK_TAG: "v4.4.6"
      GECKO_SDK_COMMIT: "59d2160fe448b13730a91c0f019a8b4c53c43eb2"
      # librail_efr32xg14_gcc_release.a is a Git LFS file whose object is not on GitHub's LFS
      # server; it is taken from the release asset gecko-sdk.zip (1.3 GB) with range requests
      RAIL_LIB: "platform/radio/rail_lib/autogen/librail_release/librail_efr32xg14_gcc_release.a"
      RAIL_LIB_SHA256: "817188456d217bcfbe939720899bb9de2c00fbf80eb349026cc1b87e1886057a"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install arm-none-eabi-gcc and newlib
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-none-eabi libnewlib-arm-none-eabi make
          arm-none-eabi-gcc --version | head -1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: sdk-cache
        with:
          path: ${{ runner.temp }}/gecko_sdk
          key: gecko-sdk-${{ env.GECKO_SDK_COMMIT }}-${{ env.RAIL_LIB_SHA256 }}
      - name: Gecko SDK ${{ env.GECKO_SDK_TAG }} (sparse checkout + RAIL library)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          sdk="$RUNNER_TEMP/gecko_sdk"
          git clone -q --depth 1 --branch "$GECKO_SDK_TAG" --filter=blob:none --sparse \
              https://github.com/SiliconLabs/gecko_sdk.git "$sdk"
          test "$(git -C "$sdk" rev-parse HEAD)" = "$GECKO_SDK_COMMIT"
          GIT_LFS_SKIP_SMUDGE=1 git -C "$sdk" sparse-checkout set --no-cone \
              /platform/Device/SiliconLabs/EFR32FG14P/ /platform/CMSIS/Core/Include/ \
              /platform/common/inc/ /platform/emlib/ /platform/radio/rail_lib/common/ \
              /platform/radio/rail_lib/chip/efr32/efr32xg1x/
          mkdir -p "$sdk/$(dirname "$RAIL_LIB")"
          python3 .github/scripts/fetch_zip_member.py \
              "https://github.com/SiliconLabs/gecko_sdk/releases/download/${GECKO_SDK_TAG}/gecko-sdk.zip" \
              "$RAIL_LIB" "$sdk/$RAIL_LIB"
      - name: Check the RAIL library
        run: echo "${RAIL_LIB_SHA256}  $RUNNER_TEMP/gecko_sdk/$RAIL_LIB" | sha256sum -c -
      - name: config.h from the example
        run: cp SMOKE_DETECTOR/firmware/src/config.h.example SMOKE_DETECTOR/firmware/src/config.h
      - name: Build (warnings are errors)
        run: make -C SMOKE_DETECTOR/firmware GECKO_SDK="$RUNNER_TEMP/gecko_sdk"
      - name: Carrier test build
        run: make -C SMOKE_DETECTOR/firmware GECKO_SDK="$RUNNER_TEMP/gecko_sdk" BUILD=build/cw EXTRA_CFLAGS=-DRADIO_TEST_CW

  secrets:
    name: Key guard (no real keys in the repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check tracked files
        run: python3 .github/scripts/check_secrets.py

  python-tests:
    name: Python script tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the Python packages
        run: pip install -r requirements.txt pytest
      - name: Run the tests
        # derive_key.py, cc1110_tools.py (fake gateway on 127.0.0.1, fake serial port),
        # release/make_release.py (package from HEAD, no --check builds) and the key guard;
        # only public test keys, every secrets.h/config.h is written to a temporary directory
        run: python -m pytest tests -q

  python-lint:
    name: Python lint (ruff fatal errors)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Check Python syntax and undefined names
        # Fatal/bug rules only (E9 syntax, F63 invalid ops, F7 syntax in comments/types, F82 undefined names)
        run: ruff check --select E9,F63,F7,F82 .

  release-package:
    name: Release package check (zip & links)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build release zip and verify links
        # Fast check without --check firmware rebuilds (those already run in the gateway/cc1110 jobs)
        run: python release/make_release.py --out "$RUNNER_TEMP/release"

  key:
    name: Key derivation (derive_key.py)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "cryptography>=41"
      - name: Test vector
        # Public test master key 00..0f, not a real key. Device key = AES-128-ECB(master, ID padded
        # to 16 bytes); the check value is the first 3 bytes of AES(master, 0^16), as the gateway's
        # 'status' prints it.
        run: |
          out=$(python derive_key.py --master-key 000102030405060708090a0b0c0d0e0f --id 2K79A65A)
          echo "$out"
          echo "$out" | grep -q "check value C6A13B"
          echo "$out" | grep -q "Device Key (Hex): 7960FF23E9DFE83C57BF94B437CCC0B9"
          if python derive_key.py --master-key 000102030405060708090a0b0c0d0e0f --id 2K79A65; then
            echo "a 7-character ID must be rejected"; exit 1
          fi

  cppcheck:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install cppcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q cppcheck && cppcheck --version
      - name: Run cppcheck
        # warning and portability checks only (style is left to review); any finding fails the job.
        # Findings that are intended are suppressed in the code with a "// cppcheck-suppress <id>"
        # comment that says why. The SDCC storage keywords are defined away for the CC1110 code.
        run: bash .github/scripts/run_cppcheck.sh

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: sudo apt-get update -q && sudo apt-get install -y -q gitleaks && gitleaks version
      - name: Self-test of the project rule
        # A made-up password in the #define form must be found, the template placeholder must not.
        run: |
          t="$RUNNER_TEMP/gl"; mkdir -p "$t/bad" "$t/ok"
          p="Kq7vT2-not-a-"   # assembled at run time so this file itself does not match the rule
          echo "#define DEFAULT_WIFI_PASS       \"${p}real-pass\"" > "$t/bad/secrets.h"
          echo '#define DEFAULT_WIFI_PASS       "your-wifi-password"' > "$t/ok/secrets.h"
          if gitleaks detect --no-git --source "$t/bad" --config .gitleaks.toml --redact --no-banner; then
            echo "::error::project-default-password did not catch a password"; exit 1
          fi
          gitleaks detect --no-git --source "$t/ok" --config .gitleaks.toml --redact --no-banner
      - name: Scan the files
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner -v
      - name: Scan the commits not on main yet
        # The history before this check is not scanned: the master key that has been public since
        # 2026-10-22 is still the current key (TODO.md item 0: change it before deployment) and
        # stays in the old history, which is why only the new commits are scanned.
        run: |
          git rev-parse -q --verify origin/main >/dev/null || { echo "::error::origin/main not fetched"; exit 1; }
          if [ "$(git rev-list --count origin/main..HEAD)" != 0 ]; then
            gitleaks detect --source . --config .gitleaks.toml --log-opts="--diff-merges=first-parent origin/main..HEAD" --redact --no-banner -v
          else
            echo "no commits outside main"
          fi
