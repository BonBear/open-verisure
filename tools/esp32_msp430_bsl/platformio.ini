[platformio]
default_envs = esp32_c3_super_mini

[env:esp32_c3_super_mini]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Note: GPIO 2 is an ESP32-C3 strapping pin. If your wiring pulls it low at boot,
; override -D PIN_BSL_RX=1 here to move BSL RX to GPIO 1.
build_flags =
    -Wall
    -Wextra
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D PIN_TCK=0
    -D PIN_RST=4
    -D PIN_BSL_RX=2
    -D PIN_BSL_TX=3

